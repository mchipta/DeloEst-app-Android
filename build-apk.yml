name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Каркас Android-проекта
        run: |
          flutter create --org ru.deloest --project-name delo_est --platforms android --no-pub shell
          rm -rf shell/lib shell/test shell/pubspec.yaml
          mkdir -p shell/lib shell/assets
          cp pubspec.yaml shell/
          for f in lib/*.dart *.dart; do
            if [ -f "$f" ]; then cp "$f" shell/lib/; fi
          done
          for f in assets/icon.png assets/icon_fg.png assets/icon_orange.png icon.png icon_fg.png icon_orange.png; do
            if [ -f "$f" ]; then cp "$f" shell/assets/; fi
          done
          test -f shell/lib/main.dart || { echo "::error::Не найден main.dart"; exit 1; }
          for need in icon.png icon_fg.png icon_orange.png; do
            test -f "shell/assets/$need" || { echo "::error::Не найден файл иконки $need"; exit 1; }
          done
          ls shell/lib shell/assets

      - name: Зависимости и иконка
        working-directory: shell
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Настройка Android (интернет, название, смена иконки)
        working-directory: shell
        run: python3 ../configure_android.py

      - name: Постоянная подпись (обновления ставятся поверх)
        run: |
          mkdir -p ~/.android
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
          elif [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "::warning::debug.keystore не найден, будет создан новый ключ"
          fi

      - name: Сборка APK
        working-directory: shell
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Переименование
        run: cp shell/build/app/outputs/flutter-apk/app-release.apk DeloEst.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeloEst-apk
          path: DeloEst.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ДелоЕсть, сборка ${{ github.run_number }}
          files: DeloEst.apk
          make_latest: true
