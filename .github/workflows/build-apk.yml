name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Каркас Android-проекта
        run: |
          flutter create --org ru.deloest --project-name delo_est --platforms android --no-pub shell
          rm -rf shell/lib shell/test shell/pubspec.yaml
          mkdir -p shell/lib shell/assets
          cp pubspec.yaml shell/
          for f in lib/*.dart *.dart; do
            if [ -f "$f" ]; then cp "$f" shell/lib/; fi
          done
          for f in assets/icon.png assets/icon_fg.png assets/icon_orange.png assets/icon_purple.png icon.png icon_fg.png icon_orange.png icon_purple.png; do
  if [ -f "$f" ]; then cp "$f" shell/assets/; fi
done
          ls shell/lib shell/assets

      - name: Настройка Android (интернет, название)
        working-directory: shell
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent></queries>\n    <application|' "$M"
          sed -i 's|android:label="delo_est"|android:label="ДелоЕсть"|' "$M"
          grep -n "INTERNET\|android:label\|DIAL" "$M"

      - name: Зависимости и иконка
        working-directory: shell
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Постоянная подпись (обновления ставятся поверх)
        run: |
          mkdir -p ~/.android
          if [ -f signing/debug.keystore ]; then cp signing/debug.keystore ~/.android/debug.keystore; fi
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - name: Сборка APK
        working-directory: shell
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Переименование
        run: cp shell/build/app/outputs/flutter-apk/app-release.apk DeloEst.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeloEst-apk
          path: DeloEst.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ДелоЕсть, сборка ${{ github.run_number }}
          files: DeloEst.apk
          make_latest: true
